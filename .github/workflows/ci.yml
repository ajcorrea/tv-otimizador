name: CI

# Em todo push na main: valida o script. Se a versão do arquivo VERSION ainda não tiver
# uma tag v<versão>, cria a tag e publica a Release com o .zip (notas tiradas do CHANGELOG).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\TV-Otimizador.ps1", [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { Write-Host "::error::linha $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host 'Sintaxe OK'

      - name: XAML (instancia todas as janelas com o WPF)
        shell: powershell
        run: powershell -NoProfile -STA -File tools\testar-xaml.ps1

      - name: Versão do script = VERSION
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $s = Get-Content TV-Otimizador.ps1 -Raw -Encoding UTF8
          if ($s -notmatch "AppVersion\s*=\s*'$([regex]::Escape($v))'") { Write-Host "::error::VERSION ($v) diferente do AppVersion do script"; exit 1 }
          Write-Host "Versão $v OK"

  release:
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versão nova?
        id: ver
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "nova=false" >> "$GITHUB_OUTPUT"; echo "v$V já publicada."
          else
            echo "nova=true" >> "$GITHUB_OUTPUT"; echo "Publicando v$V."
          fi

      - name: Montar pacote e notas
        if: steps.ver.outputs.nova == 'true'
        run: |
          V=${{ steps.ver.outputs.versao }}
          mkdir -p dist/TV-Otimizador
          cp TV-Otimizador.ps1 TV-Otimizador.cmd README.md LICENSE CHANGELOG.md dist/TV-Otimizador/
          (cd dist && zip -r "TV-Otimizador-v$V.zip" TV-Otimizador)
          awk -v v="## [$V]" 'index($0,v)==1{f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md | tr -d '\r' > dist/notas.md
          printf '\n---\n**Instalação:** baixe o `TV-Otimizador-v%s.zip`, extraia e dê dois cliques em `TV-Otimizador.cmd`.\n' "$V" >> dist/notas.md

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.nova == 'true'
        with:
          tag_name: v${{ steps.ver.outputs.versao }}
          name: TV Otimizador v${{ steps.ver.outputs.versao }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notas.md
          files: dist/*.zip
          make_latest: true
